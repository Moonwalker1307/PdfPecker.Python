name: Wheels

# Builds the native library and a wheel for each platform, tests every wheel after installing it, and publishes them
# to PyPI with Trusted Publishing when the owner publishes a GitHub release. The same release also gets the eight native
# libraries as assets, which the npm package (Moonwalker1307/PdfPecker.Node) ships, so both languages run the very
# same binaries and there is one native build pipeline.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    # Linux wheels build inside the PyPA images, so the library links against an old glibc (manylinux_2_28) or musl
    # and runs on every distribution that tag covers. The build runs with docker directly because JavaScript actions
    # do not run in Alpine containers on arm64.
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, image: quay.io/pypa/manylinux_2_28_x86_64, rid: linux-x64, platform: manylinux_2_28_x86_64 }
          - { runner: ubuntu-24.04-arm, image: quay.io/pypa/manylinux_2_28_aarch64, rid: linux-arm64, platform: manylinux_2_28_aarch64 }
          - { runner: ubuntu-24.04, image: quay.io/pypa/musllinux_1_2_x86_64, rid: linux-musl-x64, platform: musllinux_1_2_x86_64 }
          - { runner: ubuntu-24.04-arm, image: quay.io/pypa/musllinux_1_2_aarch64, rid: linux-musl-arm64, platform: musllinux_1_2_aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test in ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} ci/linux.sh ${{ matrix.rid }} ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          path: native/bin/publish/${{ matrix.rid }}/pdfpecker_native.so
          if-no-files-found: error

  macos-windows:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, rid: osx-arm64, platform: auto-macos }
          - { runner: macos-15-intel, rid: osx-x64, platform: auto-macos }
          - { runner: windows-2025, rid: win-x64, platform: win_amd64 }
          - { runner: windows-11-arm, rid: win-arm64, platform: win_arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build and test
        run: ci/build.sh ${{ matrix.rid }} ${{ matrix.platform }} python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.rid }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          path: |
            native/bin/publish/${{ matrix.rid }}/pdfpecker_native.dylib
            native/bin/publish/${{ matrix.rid }}/pdfpecker_native.dll
          if-no-files-found: error

  publish:
    # Runs only for a published release. PyPI trusts this workflow and environment (Trusted Publishing), so no API
    # token is stored anywhere.
    if: github.event_name == 'release'
    needs: [linux, macos-windows]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pdfpecker/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The release tag matches PDFPECKER_VERSION
        run: |
          version=$(tr -d '[:space:]' < PDFPECKER_VERSION)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag $tag, PDFPECKER_VERSION $version"
          [ "$tag" = "$version" ]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: ls -l dist && test "$(ls dist/*.whl | wc -l)" -eq 8
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Attaches the eight native libraries, the ones inside the wheels, to the GitHub release as
  # pdfpecker_native-<rid>.<ext> with a SHA256SUMS file. The npm package's release downloads them from here.
  release-assets:
    if: github.event_name == 'release'
    needs: [linux, macos-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native
      - name: Name the libraries after their runtime
        run: |
          set -euo pipefail
          mkdir assets
          for dir in native/native-*; do
            rid="${dir#native/native-}"
            for file in "$dir"/pdfpecker_native.*; do
              cp "$file" "assets/pdfpecker_native-$rid.${file##*.}"
            done
          done
          (cd assets && sha256sum pdfpecker_native-* > SHA256SUMS && cat SHA256SUMS)
          test "$(ls assets/pdfpecker_native-* | wc -l)" -eq 8
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber

  # Lists the MCP server in the official MCP Registry once the wheels are on PyPI. The registry checks the
  # "mcp-name" line in the PyPI description (the README) and signs in with this workflow's GitHub identity, which owns
  # the io.github.Moonwalker1307 namespace, so no secret is needed.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Set the version in server.json
        run: |
          version=$(tr -d '[:space:]' < PDFPECKER_VERSION)
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      - run: ./mcp-publisher login github-oidc
      # PyPI can take a minute to serve a new release to the registry's check, so the publish is retried.
      - name: Publish to the MCP Registry
        run: |
          for wait in 30 60 120 240; do
            ./mcp-publisher publish && exit 0
            sleep "$wait"
          done
          ./mcp-publisher publish
